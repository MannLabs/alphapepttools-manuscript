name: Build environment

on:
  push:
    branches: [main]
  pull_request:

  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.13"]
        requirements:
          - requirements/requirements-csf.txt
          - requirements/requirements-pelsa.txt
          - requirements/requirements-scdvp.txt
          - requirements/requirements-multimodal.txt

    name: ${{ matrix.os }} Python ${{ matrix.python }} (${{ matrix.requirements }})

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel uv

      - name: Install dependencies
        run: uv pip install --system -r ${{ matrix.requirements }}